name: Quester
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  path: ^1.8.3
  shared_preferences: ^2.5.3
  crypto: ^3.0.3
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  provider: ^6.0.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon/icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/bg_arcade_pixel.png
    - assets/images/bg_royal_pixel.png
    - assets/images/icon/

  fonts:
    - family: QuesterFantasy
      fonts:
        - asset: assets/fonts/mediaval.ttf
    - family: QuesterPixel
      fonts:
        - asset: assets/fonts/pixelfont.ttf